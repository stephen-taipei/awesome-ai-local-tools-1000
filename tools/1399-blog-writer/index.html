<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Writer | AI 本地工具</title>
    <meta name="description" content="Blog Writer - AI local tool. 完全在瀏覽器本地執行，資料不外傳。">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="lang-switcher">
            <button id="lang-zh" class="lang-btn active">繁體中文</button>
            <button id="lang-en" class="lang-btn">English</button>
        </div>
        <header class="header">
            <h1 data-i18n="title">部落格撰寫工具</h1>
            <p class="subtitle" data-i18n="subtitle">完全在瀏覽器本地執行，資料不外傳</p>
        </header>
        <div class="privacy-badge">
            <span class="badge-icon">🔒</span>
            <span data-i18n="privacyBadge">100% 本地處理 · 零資料上傳</span>
        </div>
        <main class="main">
            <div class="input-section">
                <label data-i18n="inputLabel">輸入</label>
                <textarea id="input" placeholder="在此輸入..." rows="5"></textarea>
            </div>
            <button id="process-btn" class="btn btn-primary" data-i18n="process">處理</button>
            <div class="output-section" id="output-section" style="display:none">
                <label data-i18n="outputLabel">結果</label>
                <div id="output" class="output-box"></div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
