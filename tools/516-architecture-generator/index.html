<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Generator | 建築生成器 - AI Local Tools</title>
    <meta name="description" content="Generate architectural silhouettes locally in your browser with AI assistance. No upload, 100% private.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button id="lang-zh" class="lang-btn active">繁體中文</button>
            <button id="lang-en" class="lang-btn">English</button>
        </div>

        <!-- Header -->
        <header class="header">
            <h1 data-i18n="title">建築生成器</h1>
            <p class="subtitle" data-i18n="subtitle">智能建築設計，本地處理保護隱私</p>
        </header>

        <!-- Privacy Badge -->
        <div class="privacy-badge">
            <span class="badge-icon">🔒</span>
            <span data-i18n="privacyBadge">100% 本地處理 · 零資料上傳</span>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <div class="input-section">
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="buildingTypeLabel">建築類型</label>
                        <select id="buildingType" class="select-field">
                            <option value="house" data-i18n="buildingHouse">住宅</option>
                            <option value="office" data-i18n="buildingOffice">辦公大樓</option>
                            <option value="skyscraper" data-i18n="buildingSkyscraper">摩天大樓</option>
                            <option value="temple" data-i18n="buildingTemple">寺廟</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="styleLabel">建築風格</label>
                        <select id="buildingStyle" class="select-field">
                            <option value="modern" data-i18n="styleModern">現代風格</option>
                            <option value="classic" data-i18n="styleClassic">古典風格</option>
                            <option value="futuristic" data-i18n="styleFuturistic">未來風格</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="floorsLabel">樓層數</label>
                        <input type="range" id="floors" class="range-input" min="1" max="50" value="10">
                        <span class="range-value" id="floorsValue">10</span>
                    </div>
                    <div class="form-group">
                        <label data-i18n="widthLabel">寬度</label>
                        <input type="range" id="buildingWidth" class="range-input" min="1" max="10" value="5">
                        <span class="range-value" id="widthValue">5</span>
                    </div>
                </div>

                <div class="form-group">
                    <label data-i18n="colorsLabel">配色方案</label>
                    <div class="color-scheme">
                        <div class="color-picker">
                            <label data-i18n="colorMain">主色</label>
                            <input type="color" id="colorMain" class="color-input" value="#64748b">
                        </div>
                        <div class="color-picker">
                            <label data-i18n="colorAccent">強調色</label>
                            <input type="color" id="colorAccent" class="color-input" value="#94a3b8">
                        </div>
                        <div class="color-picker">
                            <label data-i18n="colorSky">天空色</label>
                            <input type="color" id="colorSky" class="color-input" value="#1e293b">
                        </div>
                    </div>
                </div>

                <button id="generateBtn" class="btn btn-primary btn-block">
                    <span data-i18n="generateBtn">生成建築</span>
                </button>
            </div>

            <!-- Progress Section -->
            <div class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText" data-i18n="processing">AI 正在生成建築...</p>
            </div>

            <!-- Canvas Section -->
            <div class="canvas-section" id="canvasSection" style="display: none;">
                <h3 data-i18n="previewTitle">建築預覽</h3>
                <div class="canvas-wrapper">
                    <canvas id="mainCanvas" width="600" height="500"></canvas>
                </div>
            </div>

            <!-- Output Section -->
            <div class="output-section" id="outputSection" style="display: none;">
                <div class="output-header">
                    <h3 data-i18n="outputTitle">生成結果</h3>
                    <div class="output-actions">
                        <button id="downloadPngBtn" class="btn btn-secondary btn-sm" data-i18n="downloadPng">下載 PNG</button>
                        <button id="downloadSvgBtn" class="btn btn-secondary btn-sm" data-i18n="downloadSvg">下載 SVG</button>
                    </div>
                </div>
                <div class="output-stats" id="outputStats"></div>
            </div>
        </main>

        <!-- Info Section -->
        <section class="info-section">
            <h2 data-i18n="howItWorks">功能特色</h2>
            <div class="info-grid">
                <div class="info-card">
                    <div class="info-icon">🏛️</div>
                    <h3 data-i18n="feature1">多種建築</h3>
                    <p data-i18n="feature1Desc">支援住宅、辦公室、摩天樓等類型</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">🎨</div>
                    <h3 data-i18n="feature2">風格多樣</h3>
                    <p data-i18n="feature2Desc">現代、古典、未來等風格選擇</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">🔒</div>
                    <h3 data-i18n="feature3">隱私保護</h3>
                    <p data-i18n="feature3Desc">所有處理在瀏覽器本地完成</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">📐</div>
                    <h3 data-i18n="feature4">參數控制</h3>
                    <p data-i18n="feature4Desc">自訂樓層數與建築寬度</p>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>
                <a href="../../index.html" data-i18n="backToHome">返回首頁</a> ·
                <span data-i18n="toolNumber">工具 #516</span>
            </p>
            <p class="copyright" data-i18n="copyright">Awesome AI Local Tools © 2024</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
