<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blur Detection | 模糊偵測 - AI Local Tools</title>
    <meta name="description" content="Detect blur regions in images using AI. 100% local processing.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button id="lang-zh" class="lang-btn active">繁體中文</button>
            <button id="lang-en" class="lang-btn">English</button>
        </div>

        <!-- Header -->
        <header class="header">
            <h1 data-i18n="title">模糊偵測</h1>
            <p class="subtitle" data-i18n="subtitle">AI 偵測並標示圖片中的模糊區域</p>
        </header>

        <!-- Privacy Badge -->
        <div class="privacy-badge">
            <span class="badge-icon">🔒</span>
            <span data-i18n="privacyBadge">100% 本地處理 · 零資料上傳</span>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Area -->
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept="image/*" hidden>
                <div class="upload-icon">🔍</div>
                <p class="upload-text" data-i18n="uploadText">拖放圖片到此處或點擊上傳</p>
                <p class="upload-hint" data-i18n="uploadHint">支援 PNG、JPG、WebP 格式</p>
            </div>

            <!-- Preview Area -->
            <div class="preview-area" id="previewArea" style="display: none;">
                <!-- Image Comparison -->
                <div class="image-comparison">
                    <div class="image-box">
                        <h3 data-i18n="original">原圖</h3>
                        <canvas id="originalCanvas"></canvas>
                    </div>
                    <div class="image-box">
                        <h3 data-i18n="blurMap">模糊熱力圖</h3>
                        <canvas id="blurCanvas"></canvas>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText" data-i18n="analyzing">分析中...</p>
                </div>

                <!-- Results Section -->
                <div class="results-section" id="resultsSection" style="display: none;">
                    <!-- Overall Status -->
                    <div class="status-card" id="statusCard">
                        <div class="status-icon" id="statusIcon">✓</div>
                        <div class="status-text" id="statusText"></div>
                    </div>

                    <!-- Metrics -->
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <span class="metric-value" id="sharpnessScore">0</span>
                            <span class="metric-label" data-i18n="sharpness">清晰度評分</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-value" id="blurPercent">0%</span>
                            <span class="metric-label" data-i18n="blurArea">模糊區域</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-value" id="blurType">-</span>
                            <span class="metric-label" data-i18n="blurType">模糊類型</span>
                        </div>
                    </div>

                    <!-- Legend -->
                    <div class="legend">
                        <h4 data-i18n="legend">圖例</h4>
                        <div class="legend-items">
                            <div class="legend-item">
                                <span class="legend-color" style="background: #22c55e;"></span>
                                <span data-i18n="sharp">清晰</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-color" style="background: #f59e0b;"></span>
                                <span data-i18n="slightBlur">輕微模糊</span>
                            </div>
                            <div class="legend-item">
                                <span class="legend-color" style="background: #ef4444;"></span>
                                <span data-i18n="heavyBlur">嚴重模糊</span>
                            </div>
                        </div>
                    </div>

                    <!-- Recommendations -->
                    <div class="recommendations">
                        <h4 data-i18n="recommendations">建議</h4>
                        <ul id="recommendationsList"></ul>
                    </div>
                </div>

                <!-- Actions -->
                <div class="actions">
                    <button id="downloadBtn" class="btn btn-success" data-i18n="downloadMap">下載熱力圖</button>
                    <button id="resetBtn" class="btn btn-secondary" data-i18n="uploadAnother">上傳其他圖片</button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>
                <a href="../../index.html" data-i18n="backToHome">返回首頁</a> ·
                <span data-i18n="toolNumber">工具 #494</span>
            </p>
            <p class="copyright">Awesome AI Local Tools</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
