<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Design Generator | 產品設計生成 - AI Local Tools</title>
    <meta name="description" content="Generate product design concepts locally in your browser with AI assistance. No upload, 100% private.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button id="lang-zh" class="lang-btn active">繁體中文</button>
            <button id="lang-en" class="lang-btn">English</button>
        </div>

        <!-- Header -->
        <header class="header">
            <h1 data-i18n="title">產品設計生成</h1>
            <p class="subtitle" data-i18n="subtitle">智能產品設計，本地處理保護隱私</p>
        </header>

        <!-- Privacy Badge -->
        <div class="privacy-badge">
            <span class="badge-icon">🔒</span>
            <span data-i18n="privacyBadge">100% 本地處理 · 零資料上傳</span>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <div class="input-section">
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="categoryLabel">產品類別</label>
                        <select id="category" class="select-field">
                            <option value="electronics" data-i18n="categoryElectronics">電子產品</option>
                            <option value="furniture" data-i18n="categoryFurniture">家具</option>
                            <option value="toy" data-i18n="categoryToy">玩具</option>
                            <option value="appliance" data-i18n="categoryAppliance">家電</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="materialLabel">材質</label>
                        <select id="material" class="select-field">
                            <option value="metal" data-i18n="materialMetal">金屬</option>
                            <option value="plastic" data-i18n="materialPlastic">塑膠</option>
                            <option value="wood" data-i18n="materialWood">木材</option>
                            <option value="glass" data-i18n="materialGlass">玻璃</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="finishLabel">表面處理</label>
                        <select id="finish" class="select-field">
                            <option value="matte" data-i18n="finishMatte">霧面</option>
                            <option value="glossy" data-i18n="finishGlossy">亮面</option>
                            <option value="textured" data-i18n="finishTextured">紋理</option>
                            <option value="brushed" data-i18n="finishBrushed">拉絲</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="complexityLabel">複雜度</label>
                        <input type="range" id="complexity" class="range-input" min="1" max="10" value="5">
                        <span class="range-value" id="complexityValue">5</span>
                    </div>
                </div>

                <div class="form-group">
                    <label data-i18n="colorsLabel">配色方案</label>
                    <div class="color-scheme">
                        <div class="color-picker">
                            <label data-i18n="colorPrimary">主色</label>
                            <input type="color" id="colorPrimary" class="color-input" value="#0891b2">
                        </div>
                        <div class="color-picker">
                            <label data-i18n="colorSecondary">副色</label>
                            <input type="color" id="colorSecondary" class="color-input" value="#22d3ee">
                        </div>
                        <div class="color-picker">
                            <label data-i18n="colorAccent">強調色</label>
                            <input type="color" id="colorAccent" class="color-input" value="#1e293b">
                        </div>
                    </div>
                </div>

                <button id="generateBtn" class="btn btn-primary btn-block">
                    <span data-i18n="generateBtn">生成設計</span>
                </button>
            </div>

            <!-- Progress Section -->
            <div class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText" data-i18n="processing">AI 正在生成產品設計...</p>
            </div>

            <!-- Canvas Section -->
            <div class="canvas-section" id="canvasSection" style="display: none;">
                <h3 data-i18n="previewTitle">設計預覽</h3>
                <div class="canvas-wrapper">
                    <canvas id="mainCanvas" width="600" height="500"></canvas>
                </div>
            </div>

            <!-- Output Section -->
            <div class="output-section" id="outputSection" style="display: none;">
                <div class="output-header">
                    <h3 data-i18n="outputTitle">生成結果</h3>
                    <div class="output-actions">
                        <button id="downloadPngBtn" class="btn btn-secondary btn-sm" data-i18n="downloadPng">下載 PNG</button>
                        <button id="regenerateBtn" class="btn btn-secondary btn-sm" data-i18n="regenerate">重新生成</button>
                    </div>
                </div>
                <div class="output-stats" id="outputStats"></div>
            </div>
        </main>

        <!-- Info Section -->
        <section class="info-section">
            <h2 data-i18n="howItWorks">功能特色</h2>
            <div class="info-grid">
                <div class="info-card">
                    <div class="info-icon">📱</div>
                    <h3 data-i18n="feature1">多種產品</h3>
                    <p data-i18n="feature1Desc">支援電子產品、家具、玩具、家電</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">🎨</div>
                    <h3 data-i18n="feature2">材質選擇</h3>
                    <p data-i18n="feature2Desc">金屬、塑膠、木材、玻璃等材質</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">🔒</div>
                    <h3 data-i18n="feature3">隱私保護</h3>
                    <p data-i18n="feature3Desc">所有處理在瀏覽器本地完成</p>
                </div>
                <div class="info-card">
                    <div class="info-icon">🎯</div>
                    <h3 data-i18n="feature4">3D 效果</h3>
                    <p data-i18n="feature4Desc">生成逼真的 3D 產品渲染</p>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>
                <a href="../../index.html" data-i18n="backToHome">返回首頁</a> ·
                <span data-i18n="toolNumber">工具 #519</span>
            </p>
            <p class="copyright" data-i18n="copyright">Awesome AI Local Tools © 2024</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
