<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomaly Detection | 異常偵測 - AI Local Tools</title>
    <meta name="description" content="Detect anomalies in images using AI. 100% local processing.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button id="lang-zh" class="lang-btn active">繁體中文</button>
            <button id="lang-en" class="lang-btn">English</button>
        </div>

        <!-- Header -->
        <header class="header">
            <h1 data-i18n="title">異常偵測</h1>
            <p class="subtitle" data-i18n="subtitle">AI 偵測圖片中的異常區域與不規則性</p>
        </header>

        <!-- Privacy Badge -->
        <div class="privacy-badge">
            <span class="badge-icon">🔒</span>
            <span data-i18n="privacyBadge">100% 本地處理 · 零資料上傳</span>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Area -->
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept="image/*" hidden>
                <div class="upload-icon">🔬</div>
                <p class="upload-text" data-i18n="uploadText">拖放圖片到此處或點擊上傳</p>
                <p class="upload-hint" data-i18n="uploadHint">支援 PNG、JPG、WebP 格式</p>
            </div>

            <!-- Preview Area -->
            <div class="preview-area" id="previewArea" style="display: none;">
                <!-- Image Comparison -->
                <div class="image-comparison">
                    <div class="image-box">
                        <h3 data-i18n="original">原圖</h3>
                        <canvas id="originalCanvas"></canvas>
                    </div>
                    <div class="image-box">
                        <h3 data-i18n="anomalyMap">異常熱力圖</h3>
                        <canvas id="anomalyCanvas"></canvas>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText" data-i18n="analyzing">分析中...</p>
                </div>

                <!-- Results Section -->
                <div class="results-section" id="resultsSection" style="display: none;">
                    <!-- Status -->
                    <div class="status-card" id="statusCard">
                        <div class="status-icon" id="statusIcon">✓</div>
                        <div class="status-info">
                            <div class="status-title" id="statusTitle"></div>
                            <div class="status-subtitle" id="statusSubtitle"></div>
                        </div>
                    </div>

                    <!-- Metrics -->
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <span class="metric-value" id="anomalyScore">0</span>
                            <span class="metric-label" data-i18n="anomalyScore">異常分數</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-value" id="regionsCount">0</span>
                            <span class="metric-label" data-i18n="regionsDetected">偵測區域</span>
                        </div>
                        <div class="metric-card">
                            <span class="metric-value" id="coverage">0%</span>
                            <span class="metric-label" data-i18n="coverage">異常覆蓋率</span>
                        </div>
                    </div>

                    <!-- Detected Anomalies -->
                    <div class="anomalies-section">
                        <h3 data-i18n="detectedAnomalies">偵測到的異常</h3>
                        <div id="anomaliesList"></div>
                    </div>

                    <!-- Legend -->
                    <div class="legend">
                        <div class="legend-item">
                            <span class="legend-color normal"></span>
                            <span data-i18n="normal">正常</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color mild"></span>
                            <span data-i18n="mildAnomaly">輕微異常</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color severe"></span>
                            <span data-i18n="severeAnomaly">嚴重異常</span>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="actions">
                    <button id="downloadBtn" class="btn btn-success" data-i18n="downloadMap">下載分析圖</button>
                    <button id="resetBtn" class="btn btn-secondary" data-i18n="uploadAnother">上傳其他圖片</button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>
                <a href="../../index.html" data-i18n="backToHome">返回首頁</a> ·
                <span data-i18n="toolNumber">工具 #499</span>
            </p>
            <p class="copyright">Awesome AI Local Tools</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
