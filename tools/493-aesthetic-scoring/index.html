<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Scoring | 美學評分 - AI Local Tools</title>
    <meta name="description" content="Score image aesthetics and quality using AI. 100% local processing.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button id="lang-zh" class="lang-btn active">繁體中文</button>
            <button id="lang-en" class="lang-btn">English</button>
        </div>

        <!-- Header -->
        <header class="header">
            <h1 data-i18n="title">美學評分</h1>
            <p class="subtitle" data-i18n="subtitle">AI 評估圖片的美學品質與藝術價值</p>
        </header>

        <!-- Privacy Badge -->
        <div class="privacy-badge">
            <span class="badge-icon">🔒</span>
            <span data-i18n="privacyBadge">100% 本地處理 · 零資料上傳</span>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Area -->
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept="image/*" hidden>
                <div class="upload-icon">🎨</div>
                <p class="upload-text" data-i18n="uploadText">拖放圖片到此處或點擊上傳</p>
                <p class="upload-hint" data-i18n="uploadHint">支援 PNG、JPG、WebP 格式</p>
            </div>

            <!-- Preview Area -->
            <div class="preview-area" id="previewArea" style="display: none;">
                <div class="image-preview">
                    <img id="previewImage" alt="Preview">
                </div>

                <!-- Progress Bar -->
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText" data-i18n="analyzing">評估中...</p>
                </div>

                <!-- Score Section -->
                <div class="score-section" id="scoreSection" style="display: none;">
                    <!-- Main Score -->
                    <div class="main-score">
                        <div class="score-circle" id="scoreCircle">
                            <span class="score-value" id="scoreValue">0</span>
                            <span class="score-label" data-i18n="overallScore">綜合評分</span>
                        </div>
                        <div class="score-rating" id="scoreRating"></div>
                    </div>

                    <!-- Score Breakdown -->
                    <div class="score-breakdown">
                        <h3 data-i18n="breakdown">評分細項</h3>
                        <div class="score-items">
                            <div class="score-item">
                                <span class="score-item-label" data-i18n="composition">構圖</span>
                                <div class="score-item-bar">
                                    <div class="score-item-fill" id="compositionFill"></div>
                                </div>
                                <span class="score-item-value" id="compositionValue">0</span>
                            </div>
                            <div class="score-item">
                                <span class="score-item-label" data-i18n="colorHarmony">色彩和諧</span>
                                <div class="score-item-bar">
                                    <div class="score-item-fill" id="colorFill"></div>
                                </div>
                                <span class="score-item-value" id="colorValue">0</span>
                            </div>
                            <div class="score-item">
                                <span class="score-item-label" data-i18n="lighting">光線</span>
                                <div class="score-item-bar">
                                    <div class="score-item-fill" id="lightingFill"></div>
                                </div>
                                <span class="score-item-value" id="lightingValue">0</span>
                            </div>
                            <div class="score-item">
                                <span class="score-item-label" data-i18n="clarity">清晰度</span>
                                <div class="score-item-bar">
                                    <div class="score-item-fill" id="clarityFill"></div>
                                </div>
                                <span class="score-item-value" id="clarityValue">0</span>
                            </div>
                            <div class="score-item">
                                <span class="score-item-label" data-i18n="creativity">創意性</span>
                                <div class="score-item-bar">
                                    <div class="score-item-fill" id="creativityFill"></div>
                                </div>
                                <span class="score-item-value" id="creativityValue">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Suggestions -->
                    <div class="suggestions-section">
                        <h3 data-i18n="suggestions">改善建議</h3>
                        <ul id="suggestionsList"></ul>
                    </div>
                </div>

                <!-- Actions -->
                <div class="actions">
                    <button id="exportBtn" class="btn btn-success" data-i18n="export">匯出報告</button>
                    <button id="resetBtn" class="btn btn-secondary" data-i18n="uploadAnother">上傳其他圖片</button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>
                <a href="../../index.html" data-i18n="backToHome">返回首頁</a> ·
                <span data-i18n="toolNumber">工具 #493</span>
            </p>
            <p class="copyright">Awesome AI Local Tools</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
