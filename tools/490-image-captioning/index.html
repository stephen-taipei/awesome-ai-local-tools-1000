<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Captioning | AI Local Tools</title>
    <meta name="description" content="Generate captions for images locally in your browser with AI.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button id="lang-zh" class="lang-btn active">繁體中文</button>
            <button id="lang-en" class="lang-btn">English</button>
        </div>

        <!-- Header -->
        <header class="header">
            <h1 data-i18n="title">圖像描述生成</h1>
            <p class="subtitle" data-i18n="subtitle">使用 AI 為圖片生成描述文字</p>
        </header>

        <!-- Privacy Badge -->
        <div class="privacy-badge">
            <span class="badge-icon">🔒</span>
            <span data-i18n="privacyBadge">100% 本地處理 · 零資料上傳</span>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Area -->
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept="image/*" hidden>
                <div class="upload-icon">📝</div>
                <p class="upload-text" data-i18n="uploadText">拖放圖片到此處或點擊上傳</p>
                <p class="upload-hint" data-i18n="uploadHint">支援 PNG、JPG、WebP 格式</p>
            </div>

            <!-- Preview Area -->
            <div class="preview-area" id="previewArea" style="display: none;">
                <div class="image-container">
                    <div class="image-box">
                        <h3 data-i18n="originalImage">原始圖片</h3>
                        <div class="image-wrapper">
                            <img id="originalImage" alt="Original">
                        </div>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="progress-container" id="progressContainer" style="display: none;">
                    <div class="progress-info">
                        <span id="progressText" data-i18n="analyzing">正在生成描述...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <!-- Results -->
                <div class="results-section" id="resultsSection" style="display: none;">
                    <div class="caption-card" id="captionCard">
                        <h3 data-i18n="generatedCaption">生成的描述</h3>
                        <div class="caption-text" id="captionText"></div>
                        <button class="copy-btn" id="copyBtn" data-i18n="copyCaption">複製描述</button>
                    </div>

                    <div class="alternative-captions" id="alternativeCaptions">
                        <h4 data-i18n="alternativeDescriptions">其他可能的描述</h4>
                        <div class="alt-list" id="altList"></div>
                    </div>

                    <div class="detected-elements" id="detectedElements">
                        <h4 data-i18n="detectedElements">偵測到的元素</h4>
                        <div class="element-tags" id="elementTags"></div>
                    </div>

                    <!-- Actions -->
                    <div class="actions">
                        <button id="downloadBtn" class="btn btn-primary" data-i18n="exportResults">匯出結果</button>
                        <button id="resetBtn" class="btn btn-secondary" data-i18n="uploadAnother">上傳其他圖片</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>
                <a href="../../index.html" data-i18n="backToHome">返回首頁</a> ·
                <span data-i18n="toolNumber">工具 #490</span>
            </p>
            <p class="copyright">Awesome AI Local Tools</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
