name: Repository audit
on:
  push:
    branches: [main, 'audit/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts
      - name: Verify reproducible assets and dependency advisories
        run: |
          npm run build:vendor
          git diff --exit-code -- vendor package-lock.json
          mkdir -p audit-output
          npm audit --json > audit-output/npm-audit.json
      - name: Unit and whole-source checks
        run: |
          set -o pipefail
          npm test | tee audit-output/unit-tests.txt
          npm run audit:site
      - name: Browser regression suite
        run: |
          python3 -m pip install -r verification/requirements.txt
          python3 -m playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: audit-results
          path: audit-output/
          retention-days: 7
          if-no-files-found: warn
